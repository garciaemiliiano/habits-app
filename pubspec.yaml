name: habits_app
description: App personal de tracking de hábitos. Reemplazo de Loop Habits con Material 3 Expressive.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Persistencia local
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # UI / theming
  dynamic_color: ^1.7.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0

  # Utilidades
  intl: ^0.19.0

  # Skeleton shimmer M3 para estados de carga
  skeletonizer: ^2.1.3

  # Notificaciones locales + tz para scheduling DST-safe
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  permission_handler: ^11.3.1

  # IA on-device — Gemini Nano vía Android AICore (Pixel 9+)
  gemini_nano_android: ^1.1.3

  # IA cloud — Gemini API via Google AI Studio
  googleai_dart: ^6.3.0

  # Render de markdown en las respuestas del coach
  flutter_markdown_plus: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
    - assets/prompts/coach/
    - assets/prompts/habit_insight/
